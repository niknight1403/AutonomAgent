services:
  - type: web
    name: autonomagent-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npx prisma generate --schema services/api/prisma/schema.prisma && npm run build --workspace @autonomagent/api
    startCommand: npx prisma migrate deploy --schema services/api/prisma/schema.prisma && npm run start --workspace @autonomagent/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRADING_MODE
        value: PAPER
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: EMERGENCY_STOP
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: autonomagent-vision-db
          property: connectionString
      - key: AUTH_SIGNING_SECRET
        generateValue: true

databases:
  - name: autonomagent-vision-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: autonomagent_vision_db
    user: autonomagent_vision_db_user
    ipAllowList: []
