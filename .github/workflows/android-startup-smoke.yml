name: Android startup smoke
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package*.json'
      - '.github/workflows/android-startup-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release-mode APK
        working-directory: apps/mobile/android
        run: bash gradlew assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash -e .github/scripts/android-startup-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autonomagent-startup-tested-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
